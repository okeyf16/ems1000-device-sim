<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EMS-1000 panel: sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%232f7d4f%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script src="/login.js" defer></script>
</head>
<body class="login-page">
<main class="login-card">
  <h1>EMS-1000 <span class="thin">simulator</span></h1>
  <p class="hint">This panel is shared. Enter the PIN you were given: the viewer PIN shows the readings, the operator PIN also unlocks the controls.</p>
  <form id="login-form" novalidate>
    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required minlength="6" autofocus>
    <button class="btn go" type="submit">Sign in</button>
    <p class="login-error" id="login-error" role="alert" aria-live="assertive"></p>
  </form>
</main>
</body>
</html>
